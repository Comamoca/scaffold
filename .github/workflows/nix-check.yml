name: Nix Check

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      - name: Check root flake
        run: nix flake check

      - name: Check template flakes
        run: |
          for flake in */flake.nix; do
            dir="${flake%/flake.nix}"
            echo "Checking $dir..."
            nix flake check "./$dir"
          done
